# The only path that writes baselines. Runs on the same runner image and
# Ollama settings as the nightly, so the recorded answers are the ones the
# canary will see. Opens a pull request; nothing is pushed to main.
#
#   mode=record  re-record every case of the backend (snapgate record --force)
#   mode=accept  run a check, then promote only the cases that drifted, are
#                stale, or have no baseline (snapgate accept). This is the
#                re-baseline path after a drift issue or an intentional
#                prompt or check change.
#
# Either way the result is verified with a second full `snapgate check`
# before the PR is opened: `record` does not run the checks on what it
# records, and a case that does not pass right after being recorded is
# either a baseline the checks reject or an answer that is not reproducible
# on the runner, neither of which belongs on main. Ollama cases are sent
# one at a time, each after a server restart, in record, verify, and the
# nightly alike: on the runner's CPU the answer depends on what the prompt
# cache already holds (see scripts/ollama-serve.sh), and an empty cache is
# the only state measured reproducible across runs and across CPU models.
# Hosted cost: two calls per case (up to 40 for openai) in either mode.
name: record

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Which backend to record
        type: choice
        options: [both, ollama, openai]
        default: both
      mode:
        description: record everything, or accept only what changed
        type: choice
        options: [record, accept]
        default: record

permissions:
  contents: write
  pull-requests: write

# Shares the nightly's group so a record never runs while a canary is running.
concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BACKEND: ${{ inputs.backend }}
      MODE: ${{ inputs.mode }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-snapgate
      - if: inputs.backend != 'openai'
        uses: ./.github/actions/setup-ollama

      - name: Record or accept, then verify
        run: |
          case "$BACKEND" in
            both) backends="ollama openai" ;;
            *)    backends="$BACKEND" ;;
          esac
          mkdir -p fingerprints
          for b in $backends; do
            if [ "$b" = openai ] && [ -z "$OPENAI_API_KEY" ]; then
              echo "::error::OPENAI_API_KEY secret is not set"; exit 1
            fi
            cases=$(yq -r ".cases[] | select(.provider == \"$b\") | .name" snapgate.yaml)
            before=""
            if [ "$b" = ollama ]; then before=scripts/ollama-serve.sh; fi
            export BEFORE_CASE="$before"
            echo "== $MODE $b"
            case "$MODE" in
              record)
                for c in $cases; do
                  if [ -n "$before" ]; then $before >/dev/null; fi
                  snapgate record --force "$c"
                done
                ;;
              accept)
                scripts/check.sh "$b" || true
                todo=$(jq -r '.cases[] | select(.status == "drift" or .status == "stale" or .status == "missing") | .name' ".snapgate/reports/$b.json")
                if [ -z "$todo" ]; then
                  echo "nothing to accept for $b"
                  continue
                fi
                # shellcheck disable=SC2086
                snapgate accept $todo
                ;;
            esac

            echo "== verify $b (every case, fresh server per case)"
            if ! REPORT_DIR=.snapgate/verify scripts/check.sh "$b"; then
              REPORT_DIR=.snapgate/verify scripts/explain-exit.sh "$b"
              echo "::error::recorded $b baselines do not pass a fresh full check (a check rejects the recorded answer, or the answer is not reproducible on this runner). No PR opened."
              exit 1
            fi

            case "$b" in
              ollama)
                scripts/fingerprint.sh > fingerprints/ollama.json
                ;;
              openai)
                # Hosted identity is whatever the endpoint reports back.
                for c in $cases; do cat ".snapgate/baselines/$c.json"; done \
                  | jq -s '{alias: (map(.request.model) | unique), resolved_model: (map(.response.model) | unique)}' \
                  > fingerprints/openai.json
                ;;
            esac
            cat "fingerprints/$b.json"
          done

      - name: Open a pull request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="snapshots/$MODE-$BACKEND-$(date -u +%Y%m%d)-$GITHUB_RUN_ID"
          git checkout -b "$branch"
          git add .snapgate/baselines fingerprints
          if git diff --cached --quiet; then
            echo "::notice::no baseline or fingerprint changed; nothing to open"
            exit 0
          fi
          changed=$(git diff --cached --name-only)
          git commit -q -m "snapshots: $MODE $BACKEND ($(date -u +%F))" -m "Recorded and verified by the record workflow: $RUN_URL"
          git push -q origin "$branch"
          {
            echo "Snapshots recorded on the runner by the **record** workflow (mode \`$MODE\`, backend \`$BACKEND\`), then verified with a second \`snapgate check\` that every recorded case passes."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "## Changed"
            echo
            echo '```'
            echo "$changed"
            echo '```'
            echo
            for f in fingerprints/*.json; do
              [ -f "$f" ] || continue
              echo "## $f"
              echo
              echo '```json'
              cat "$f"
              echo '```'
              echo
            done
            echo "Note: pull requests opened with the built-in token do not trigger the \`gate\` workflow. Close and reopen this PR to run it, or merge on the strength of the record log."
          } > "$RUNNER_TEMP/pr.md"
          gh label create snapshots --description "Baseline updates recorded on the runner" --color 0E8A16 --force
          gh pr create --title "snapshots: $MODE $BACKEND ($(date -u +%F))" --body-file "$RUNNER_TEMP/pr.md" --label snapshots --head "$branch"
