# The consumer integration: every pull request re-runs the prompts against
# both upstreams and compares with the committed baselines. Any non-zero
# Snapgate exit fails the job, and branch protection turns that into a
# blocked merge. Exit 2 (a prompt changed, baseline not re-recorded) is the
# common case for a PR; the fix is `snapgate accept` (see README).
name: gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ollama:
    name: snapgate check (ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Ollama cases run one at a time after a server restart; see scripts/ollama-serve.sh.
      BEFORE_CASE: scripts/ollama-serve.sh
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-snapgate
      - uses: ./.github/actions/setup-ollama
      # Ollama baselines are per CPU SIMD class (scripts/host-baselines.sh). On a
      # class with no recorded set the gate has nothing to compare against and
      # passes with a warning rather than blocking the merge at random.
      - name: Load this CPU's baseline set
        id: host
        run: |
          slug=$(scripts/host-baselines.sh slug)
          if scripts/host-baselines.sh load; then
            echo "comparable=true" >> "$GITHUB_OUTPUT"
          else
            echo "comparable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=not comparable (ollama)::this runner's CPU class is '$slug' and hosts/$slug/ has no baseline set; the Ollama gate cannot run here. Re-run the job to get another runner, or record a set for this class."
          fi
      - name: Check
        if: steps.host.outputs.comparable == 'true'
        run: scripts/check.sh ollama
      - name: Explain
        if: failure()
        run: scripts/explain-exit.sh ollama

  openai:
    name: snapgate check (openai)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-snapgate
      - name: Check
        if: env.OPENAI_API_KEY != ''
        run: scripts/check.sh openai
      - name: Explain
        if: failure()
        run: scripts/explain-exit.sh openai
      - name: Skipped
        if: env.OPENAI_API_KEY == ''
        run: echo "::notice::OPENAI_API_KEY is not available to this run (pull request from a fork?); hosted check skipped"
