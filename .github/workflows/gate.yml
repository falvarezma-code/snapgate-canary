# The consumer integration: every pull request re-runs the prompts against
# both upstreams and compares with the committed baselines. A failing job
# is a blocked merge through branch protection. Exit 2 (a prompt changed,
# baseline not re-recorded) is the common case for a PR; the fix is
# `snapgate accept` (see README). Any non-zero exit fails the Ollama job,
# whose runtime settings live in this repo. The hosted job lets one kind of
# drift through as a warning; see its Check step.
name: gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ollama:
    name: snapgate check (ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Ollama cases run one at a time after a server restart; see scripts/ollama-serve.sh.
      BEFORE_CASE: scripts/ollama-serve.sh
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-snapgate
      - uses: ./.github/actions/setup-ollama
      # Ollama baselines are per CPU SIMD class (scripts/host-baselines.sh). On a
      # class with no recorded set the gate has nothing to compare against and
      # passes with a warning rather than blocking the merge at random.
      - name: Load this CPU's baseline set
        id: host
        run: |
          slug=$(scripts/host-baselines.sh slug)
          if scripts/host-baselines.sh load; then
            echo "comparable=true" >> "$GITHUB_OUTPUT"
          else
            echo "comparable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=not comparable (ollama)::this runner's CPU class is '$slug' and hosts/$slug/ has no baseline set; the Ollama gate cannot run here. Re-run the job to get another runner, or record a set for this class."
          fi
      - name: Check
        if: steps.host.outputs.comparable == 'true'
        run: scripts/check.sh ollama
      - name: Explain
        if: failure()
        run: scripts/explain-exit.sh ollama

  openai:
    name: snapgate check (openai)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-snapgate
      # Hosted drift (exit 1) cannot come from a pull request whose requests
      # all match their baselines, which a drift status guarantees (G10
      # aside). It is the nightly's subject, and gpt-4o-mini rewords free
      # text from call to call (GAPS.md G18), so a wording change alone is a
      # warning here. It still blocks when a check that judges the answer on
      # its own fails (contains, length, JSON, ...), or when the baseline
      # fails its own checks (empty diff): those are regressions, not rewording.
      # Snapgate's exit code cannot tell the two apart (G19), so the report is read.
      - name: Check
        if: env.OPENAI_API_KEY != ''
        run: |
          set +e
          scripts/check.sh openai
          code=$?
          set -e
          [ "$code" = 1 ] || exit "$code"
          report=.snapgate/reports/openai.json
          blocking=$(jq -r '[.cases[] | select(.status == "drift")
            | select(.diff == "" or ([.samples[]?.checks[]? | select(.passed | not) | .type]
                | any(. != "exact" and . != "normalized" and . != "similarity")))
            | .name] | join(" ")' "$report")
          if [ -n "$blocking" ]; then
            echo "::error::hosted drift that fails a check on the answer itself, not only the baseline comparison: $blocking"
            exit 1
          fi
          for c in $(jq -r '.cases[] | select(.status == "drift") | .name' "$report"); do
            echo "::warning title=hosted rewording ($c)::the answer changed but every check on it passed; the diff is in the log above. Not caused by this pull request; the nightly tracks it."
          done
      - name: Explain
        if: failure()
        run: scripts/explain-exit.sh openai
      - name: Skipped
        if: env.OPENAI_API_KEY == ''
        run: echo "::notice::OPENAI_API_KEY is not available to this run (pull request from a fork?); hosted check skipped"
