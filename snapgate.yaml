    model: qwen2.5:1.5b
    params: {max_tokens: 8}
    messages: &p_classify_language
      - role: system
        content: "Identify the language of the message. Reply with exactly one code from this list: en, es, fr, de, pt, it. Lowercase, no punctuation, nothing else."
      - role: user
        content: "Obrigado pela resposta rápida, vou verificar o pedido ainda hoje."
    checks: &c_classify_language
      - {type: regex, pattern: '^(en|es|fr|de|pt|it)\s*$'}
