# snapgate-canary: the same 24 prompts against two upstreams.
#
# Each prompt is written once as a YAML anchor on its Ollama case and aliased
# into its OpenAI case, so a one-word edit to a system prompt changes both
# backends' fingerprints in the same PR. Case names are <group>.<case>.<backend>
# because the workflows pick a backend's cases by name.
#
# Ollama runs all 24 prompts. OpenAI runs 20 (five per group); the last prompt
# of each group is local-only, keeping the hosted budget under 24 requests per
# run including retries.
#
# Checks: every case has structural assertions that describe what a correct
# answer looks like, plus a baseline comparison. `exact` is paired with
# `similarity: 1` on purpose: they pass and fail together, and only a
# similarity check produces the `score` that lands in the drift issue.
# OpenAI summarization and code-gen use `similarity: 0.9` because hosted
# decoding at temperature 0 with a seed is close to, but not, deterministic.
# Checks are part of the fingerprint: editing one makes the case stale.
version: 1

providers:
  ollama:
    type: openai-compatible
    base_url: http://localhost:11434/v1
    # no api_key_env: keyless endpoint, no Authorization header is sent
    timeout: 180s                    # cold model load on a CPU runner
  openai:
    type: openai-compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout: 60s

defaults:
  samples: 1
  params:
    temperature: 0
    seed: 42

cases:
  # ---------------------------------------------------------------------
  # json-extraction: reply must be one JSON object matching a schema.
  # Plausible drift: numbers becoming strings, null vs "", added keys,
  # code fences, date formats, country codes. The prompt asks for compact
  # single-line JSON because Snapgate compares text, not parsed JSON
  # (GAPS.md G16): gpt-4o-mini answered the same prompt compact once and
  # pretty-printed the next time, which `exact` cannot tell from drift.
  # qwen2.5:1.5b mostly ignores the instruction and pretty-prints anyway;
  # harmless, its answers are reproducible either way.
  # ---------------------------------------------------------------------
  - name: json.order.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 120}
    messages: &p_json_order
      - role: system
        content: Extract the order from the message. Reply with a single JSON object with keys order_id (string), item (string), quantity (integer), issue (string). Compact, on a single line, no whitespace outside string values. JSON only, no markdown, no code fences, no commentary.
      - role: user
        content: "Hi, order 4821, I got 2 mugs and one of them is cracked."
    checks: &c_json_order
      - {type: json_valid}
      - {type: json_schema, schema: schemas/order.json}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: json.order.openai
    provider: openai
    model: gpt-4o-mini
    params: {max_tokens: 120}
    messages: *p_json_order
    checks: *c_json_order

  - name: json.contact.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 120}
    messages: &p_json_contact
      - role: system
        content: Extract contact details from the message. Reply with a single JSON object with keys name (string), email (string), phone (string, or null if absent). Compact, on a single line, no whitespace outside string values. JSON only, no markdown, no code fences, no commentary.
      - role: user
        content: "Please reach Dana Whitfield at dana.w@example.org; she did not leave a number."
    checks: &c_json_contact
      - {type: json_valid}
      - {type: json_schema, schema: schemas/contact.json}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: json.contact.openai
    provider: openai
    model: gpt-4o-mini
    params: {max_tokens: 120}
    messages: *p_json_contact
    checks: *c_json_contact

  - name: json.event.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 120}
    messages: &p_json_event
      - role: system
        content: Extract the event from the message. Reply with a single JSON object with keys title (string), date (string, YYYY-MM-DD), time (string, 24-hour HH:MM), location (string). Compact, on a single line, no whitespace outside string values. JSON only, no markdown, no code fences, no commentary.
      - role: user
        content: "Reminder: the Q3 planning review is on 14 October 2026 at 3pm in the Harbour Room."
    checks: &c_json_event
      - {type: json_valid}
      - {type: json_schema, schema: schemas/event.json}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: json.event.openai
    provider: openai
    model: gpt-4o-mini
    params: {max_tokens: 120}
    messages: *p_json_event
    checks: *c_json_event

  - name: json.address.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 120}
    messages: &p_json_address
      - role: system
        content: Extract the postal address from the message. Reply with a single JSON object with keys street (string), city (string), postal_code (string), country (string, ISO 3166-1 alpha-2 code). Compact, on a single line, no whitespace outside string values. JSON only, no markdown, no code fences, no commentary.
      - role: user
        content: "Ship it to 22 Rosemary Lane, Bristol BS1 4DJ, United Kingdom."
    checks: &c_json_address
      - {type: json_valid}
      - {type: json_schema, schema: schemas/address.json}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: json.address.openai
    provider: openai
    model: gpt-4o-mini
    params: {max_tokens: 120}
    messages: *p_json_address
    checks: *c_json_address

  - name: json.product.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 120}
    messages: &p_json_product
      - role: system
        content: Extract the product from the message. Reply with a single JSON object with keys name (string), price (number), currency (string, 3-letter code), in_stock (boolean). Compact, on a single line, no whitespace outside string values. JSON only, no markdown, no code fences, no commentary.
      - role: user
        content: "The Aurora desk lamp is EUR 49.90 and is back in stock as of today."
    checks: &c_json_product
      - {type: json_valid}
      - {type: json_schema, schema: schemas/product.json}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: json.product.openai
    provider: openai
    model: gpt-4o-mini
    params: {max_tokens: 120}
    messages: *p_json_product
    checks: *c_json_product

  # Local-only: the sixth prompt of each group keeps the hosted budget.
  - name: json.flight.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 120}
    messages:
      - role: system
        content: Extract the flight from the message. Reply with a single JSON object with keys flight (string), origin (string, IATA code), destination (string, IATA code), departure (string, ISO 8601 date-time). Compact, on a single line, no whitespace outside string values. JSON only, no markdown, no code fences, no commentary.
      - role: user
        content: "Flight BA285 leaves London Heathrow for San Francisco on 2026-11-02 at 11:25."
    checks:
      - {type: json_valid}
      - {type: json_schema, schema: schemas/flight.json}
      - {type: exact}
      - {type: similarity, threshold: 1}

  # ---------------------------------------------------------------------
  # classification: exactly one lowercase label from a closed set.
  # Plausible drift: label flips on ambiguous input, added punctuation or
  # explanation, capitalisation.
  # ---------------------------------------------------------------------
  - name: classify.sentiment.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 8}
    messages: &p_classify_sentiment
      - role: system
        content: "Classify the sentiment of the message. Reply with exactly one word from this list: positive, negative, neutral. Lowercase, no punctuation, nothing else."
      - role: user
        content: "Honestly the cracked mug was annoying, but support sorted it out fast."
    checks: &c_classify_sentiment
      - {type: regex, pattern: '^(positive|negative|neutral)\s*$'}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: classify.sentiment.openai
    provider: openai
    model: gpt-4o-mini
    params: {max_tokens: 8}
    messages: *p_classify_sentiment
    checks: *c_classify_sentiment

  - name: classify.intent.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 8}
    messages: &p_classify_intent
      - role: system
        content: "Classify the customer's intent. Reply with exactly one word from this list: refund, cancel, shipping, other. Lowercase, no punctuation, nothing else."
      - role: user
        content: "I ordered this three weeks ago and the tracking page still says label created. Where is it?"
    checks: &c_classify_intent
      - {type: regex, pattern: '^(refund|cancel|shipping|other)\s*$'}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: classify.intent.openai
    provider: openai
    model: gpt-4o-mini
    params: {max_tokens: 8}
    messages: *p_classify_intent
    checks: *c_classify_intent

  - name: classify.language.ollama
