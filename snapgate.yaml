  # Local-only.
  - name: codegen.parse_kv.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 200}
    messages:
      - role: system
        content: Write the requested Python function. Reply with code only, no explanation, no markdown, no code fences.
      - role: user
