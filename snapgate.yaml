      - {type: similarity, threshold: 0.9}

  - name: codegen.dedupe.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 200}
    messages: &p_codegen_dedupe
      - role: system
        content: Write the requested Python function. Reply with code only, no explanation, no markdown, no code fences.
      - role: user
        content: "Write dedupe(items) that returns a new list with duplicates removed, keeping the first occurrence and preserving order."
    checks: &c_codegen_dedupe
      - {type: regex, pattern: '(?m)^def dedupe\('}
      - {type: max_length, value: "800"}
