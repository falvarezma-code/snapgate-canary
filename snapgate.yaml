  - name: codegen.fibonacci.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 200}
    messages: &p_codegen_fibonacci
      - role: system
        content: Write the requested Python function. Reply with code only, no explanation, no markdown, no code fences.
      - role: user
        content: "Write fib(n) that returns the nth Fibonacci number iteratively, with fib(0) = 0 and fib(1) = 1."
    checks: &c_codegen_fibonacci
      - {type: regex, pattern: '(?m)^def fib\('}
      - {type: max_length, value: "800"}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: codegen.fibonacci.openai
