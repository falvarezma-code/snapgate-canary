    messages: *p_classify_language
    checks: *c_classify_language

  - name: classify.urgency.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 8}
    messages: &p_classify_urgency
      - role: system
        content: "Classify how urgent the support ticket is. Reply with exactly one word from this list: low, medium, high. Lowercase, no punctuation, nothing else."
      - role: user
        content: "Checkout has been returning a 500 error for every customer for the last twenty minutes."
    checks: &c_classify_urgency
      - {type: regex, pattern: '^(low|medium|high)\s*$'}
