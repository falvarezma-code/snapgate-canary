  # Local-only.
  - name: classify.topic.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 8}
    messages:
      - role: system
        content: "Classify the support message by topic. Reply with exactly one word from this list: billing, technical, account, sales. Lowercase, no punctuation, nothing else."
      - role: user
        content: "I was charged twice for the same month and I want the duplicate charge reversed."
    checks:
      - {type: regex, pattern: '^(billing|technical|account|sales)\s*$'}
      - {type: exact}
      - {type: similarity, threshold: 1}

  # ---------------------------------------------------------------------
  # summarization: one plain-text sentence.
  # Plausible drift: length creep, bullet points, dropped facts, preamble
  # like "Here is a summary:". Fact-retention checks (`contains "2.4"`,
  # `contains "41"`) are kept only where the model's honest answer includes
  # the fact; gpt-4o-mini's incident summary drops the duration.
  # ---------------------------------------------------------------------
  - name: summarize.release.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 80}
    messages: &p_summarize_release
      - role: system
        content: Summarize the text in one sentence of at most 25 words. Plain text only, no preamble, no bullet points.
      - role: user
        content: "Version 2.4 of the CLI adds a --dry-run flag to every write command, removes the deprecated sync subcommand, and fixes a race that corrupted the cache when two instances started at once. Upgrading requires no config changes."
    checks: &c_summarize_release
      - {type: contains, value: "2.4"}
      - {type: max_length, value: "300"}
      - {type: min_length, value: "20"}
      - {type: not_contains, value: "Here is"}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: summarize.release.openai
    provider: openai
    model: gpt-4o-mini
    params: {max_tokens: 80}
    messages: *p_summarize_release
    checks:
      - {type: contains, value: "2.4"}
      - {type: max_length, value: "300"}
      - {type: min_length, value: "20"}
      - {type: not_contains, value: "Here is"}
      - {type: similarity, threshold: 0.9}

  - name: summarize.incident.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 80}
    messages: &p_summarize_incident
      - role: system
        content: Summarize the text in one sentence of at most 25 words. Plain text only, no preamble, no bullet points.
      - role: user
        content: "At 09:12 UTC the primary database ran out of disk after a log rotation job failed silently for six days. Writes were rejected for 41 minutes until an engineer expanded the volume. We are adding a disk-usage alert and a check that the rotation job actually ran."
    checks: &c_summarize_incident
      - {type: contains, value: "41"}
      - {type: max_length, value: "300"}
      - {type: min_length, value: "20"}
      - {type: not_contains, value: "Here is"}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: summarize.incident.openai
    provider: openai
    model: gpt-4o-mini
    params: {max_tokens: 80}
    messages: *p_summarize_incident
    checks:
      - {type: max_length, value: "300"}
      - {type: min_length, value: "20"}
      - {type: not_contains, value: "Here is"}
      - {type: similarity, threshold: 0.9}

  - name: summarize.meeting.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 80}
    messages: &p_summarize_meeting
      - role: system
        content: Summarize the text in one sentence of at most 25 words. Plain text only, no preamble, no bullet points.
      - role: user
        content: "Notes from Tuesday: Priya will draft the pricing page by Friday. Marcus is blocked on the SSO vendor and will escalate. We agreed to postpone the mobile launch to November so QA has two full weeks. Next sync is Thursday at 10."
    checks: &c_summarize_meeting
      - {type: max_length, value: "300"}
      - {type: min_length, value: "20"}
      - {type: not_contains, value: "Here is"}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: summarize.meeting.openai
    provider: openai
    model: gpt-4o-mini
    params: {max_tokens: 80}
    messages: *p_summarize_meeting
    checks:
      - {type: max_length, value: "300"}
      - {type: min_length, value: "20"}
      - {type: not_contains, value: "Here is"}
      - {type: similarity, threshold: 0.9}

  - name: summarize.review.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 80}
    messages: &p_summarize_review
      - role: system
        content: Summarize the text in one sentence of at most 25 words. Plain text only, no preamble, no bullet points.
      - role: user
        content: "I bought the Aurora lamp for my desk. The light is warm and the dimmer is smooth, but the base is lighter than it looks and it tipped over twice when I bumped the desk. Good lamp, wobbly stand."
    checks: &c_summarize_review
      - {type: max_length, value: "300"}
      - {type: min_length, value: "20"}
      - {type: not_contains, value: "Here is"}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: summarize.review.openai
    provider: openai
    model: gpt-4o-mini
    params: {max_tokens: 80}
    messages: *p_summarize_review
    checks:
      - {type: max_length, value: "300"}
      - {type: min_length, value: "20"}
      - {type: not_contains, value: "Here is"}
      - {type: similarity, threshold: 0.9}

  - name: summarize.abstract.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 80}
    messages: &p_summarize_abstract
      - role: system
        content: Summarize the text in one sentence of at most 25 words. Plain text only, no preamble, no bullet points.
      - role: user
        content: "We measured how often three small language models change their answer to a fixed prompt across 30 days. With greedy decoding and a fixed seed, local models were stable, while hosted models changed 3 to 8 percent of outputs, usually after undocumented backend updates."
    checks: &c_summarize_abstract
      - {type: max_length, value: "300"}
      - {type: min_length, value: "20"}
      - {type: not_contains, value: "Here is"}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: summarize.abstract.openai
    provider: openai
    model: gpt-4o-mini
    params: {max_tokens: 80}
    messages: *p_summarize_abstract
    checks:
      - {type: max_length, value: "300"}
      - {type: min_length, value: "20"}
      - {type: not_contains, value: "Here is"}
      - {type: similarity, threshold: 0.9}

  # Local-only.
  - name: summarize.email.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 80}
    messages:
      - role: system
        content: Summarize the text in one sentence of at most 25 words. Plain text only, no preamble, no bullet points.
      - role: user
        content: "Hello, I renewed my annual plan on 3 September but my dashboard still shows the free tier and I cannot export reports. The receipt number is R-77813. Could you check what happened and restore my access? Thanks, Lena"
    checks:
      - {type: max_length, value: "300"}
      - {type: min_length, value: "20"}
      - {type: not_contains, value: "Here is"}
      - {type: exact}
      - {type: similarity, threshold: 1}

  # ---------------------------------------------------------------------
  # code-gen: a single Python function, code only.
  # Plausible drift: code fences appear or disappear, docstrings or type
  # hints added or dropped, a different algorithm, an explanation after the
  # code. qwen2.5:1.5b fences its answer despite the instruction, so fences
  # are not a structural failure; the baseline comparison catches a change
  # either way.
  # ---------------------------------------------------------------------
  - name: codegen.palindrome.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 200}
    messages: &p_codegen_palindrome
      - role: system
        content: Write the requested Python function. Reply with code only, no explanation, no markdown, no code fences.
      - role: user
        content: "Write is_palindrome(s) that returns True if s reads the same forwards and backwards, ignoring case and non-alphanumeric characters."
    checks: &c_codegen_palindrome
      - {type: regex, pattern: '(?m)^def is_palindrome\('}
      - {type: max_length, value: "800"}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: codegen.palindrome.openai
    provider: openai
    model: gpt-4o-mini
    params: {max_tokens: 200}
    messages: *p_codegen_palindrome
    checks:
      - {type: regex, pattern: '(?m)^def is_palindrome\('}
      - {type: max_length, value: "800"}
      - {type: similarity, threshold: 0.9}

  - name: codegen.fizzbuzz.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 200}
    messages: &p_codegen_fizzbuzz
      - role: system
        content: Write the requested Python function. Reply with code only, no explanation, no markdown, no code fences.
      - role: user
        content: "Write fizzbuzz(n) that returns a list of strings for 1 through n: 'Fizz' for multiples of 3, 'Buzz' for multiples of 5, 'FizzBuzz' for both, otherwise the number as a string."
    checks: &c_codegen_fizzbuzz
      - {type: regex, pattern: '(?m)^def fizzbuzz\('}
      - {type: max_length, value: "800"}
      - {type: exact}
      - {type: similarity, threshold: 1}
  - name: codegen.fizzbuzz.openai
    provider: openai
    model: gpt-4o-mini
    params: {max_tokens: 200}
    messages: *p_codegen_fizzbuzz
    checks:
      - {type: regex, pattern: '(?m)^def fizzbuzz\('}
      - {type: max_length, value: "800"}
      - {type: similarity, threshold: 0.9}

  - name: codegen.slugify.ollama
    provider: ollama
    model: qwen2.5:1.5b
    params: {max_tokens: 200}
    messages: &p_codegen_slugify
      - role: system
        content: Write the requested Python function. Reply with code only, no explanation, no markdown, no code fences.
      - role: user
        content: "Write slugify(title) that lowercases the string, replaces runs of non-alphanumeric characters with a single hyphen, and strips leading and trailing hyphens."
    checks: &c_codegen_slugify
      - {type: regex, pattern: '(?m)^def slugify\('}
