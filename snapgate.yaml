    params: {max_tokens: 8}
    messages: &p_classify_spam
      - role: system
        content: "Classify the email. Reply with exactly one word from this list: spam, ham. Lowercase, no punctuation, nothing else."
      - role: user
        content: "Congratulations! You have been selected for a limited cash reward. Click the link within 24 hours to claim."
    checks: &c_classify_spam
      - {type: regex, pattern: '^(spam|ham)\s*$'}
